kind = "web"
previewPath = "/"
title = "Zeal Care"
version = "1.0.0"
id = "artifacts/zeal-care"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19171

[services.development]
run = "pnpm --filter @workspace/zeal-care run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zeal-care", "run", "build" ]
publicDir = "artifacts/zeal-care/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19171"
BASE_PATH = "/"
